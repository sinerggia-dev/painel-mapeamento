<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Contratos · Sinergia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contratos">
<link rel="apple-touch-icon" href="../icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
:root{
  /* Identidade Sinergia: grafite + vermelho da marca. Barra lateral sempre escura. */
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f1f2f5; --border:#e3e5ea;
  --fg:#16181d; --muted:#6a6f7b; --acc:#d12f33; --acc-soft:#fbe9e9; --acc-fg:#ffffff;
  --ok:#0f8a5f; --ok-soft:#e3f4ec; --warn:#b45309; --warn-soft:#fcf0de; --bad:#c2253a; --bad-soft:#fbe5e8; --info:#2563c9; --info-soft:#e6eefb;
  --side:#121418; --side2:#1c1f26; --side-fg:#e9eaee; --side-muted:#8b909c; --bar1:#3a3f4b; --bar2:#16181d;
  --f-display:"Barlow Semi Condensed","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:14px; --shadow:0 1px 2px rgba(16,18,24,.05),0 8px 24px rgba(16,18,24,.06);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d0f13; --surface:#16191f; --surface2:#1e222a; --border:#2a2f39;
  --fg:#eceef2; --muted:#9aa0ad; --acc:#ef4a4e; --acc-soft:#3a1719; --acc-fg:#ffffff;
  --ok:#34c78f; --ok-soft:#12302a; --warn:#f0a840; --warn-soft:#352914; --bad:#ff6b7d; --bad-soft:#3a1820; --info:#6ea2ff; --info-soft:#162640;
  --side:#08090c; --side2:#15181e; --side-fg:#e9eaee; --side-muted:#80858f; --bar1:#8a909c; --bar2:#4a4f5a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.12rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.mono{font-family:var(--f-mono);font-size:.85em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12.5px}

/* Login */
#v-login{min-height:100%;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.login{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:var(--shadow);display:grid;gap:16px}
.brand{display:flex;gap:10px;align-items:center}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.brand strong{font-family:var(--f-display);font-size:15px;line-height:1.2}

/* Shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.nav{display:grid;gap:2px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--acc-soft);color:var(--acc)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--border)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.main{min-width:0;padding:24px max(16px,min(32px,4vw)) 48px}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn svg{width:16px;height:16px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.in{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 11px;min-width:0}
.in:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.in:disabled{background:var(--surface2)}
.req::after{content:" *";color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{accent-color:var(--acc);width:16px;height:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-b{padding:18px}
.stack{display:grid;gap:16px;align-content:start}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--acc)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,transparent)}
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}

.progress{display:grid;gap:12px}
.pbar{display:grid;gap:4px}
.pbar .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.pbar .track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--acc);border-radius:99px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mut{background:var(--surface2);color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--border);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tag.semdoc{border-color:var(--warn);color:var(--warn)}
.lock{color:var(--warn);font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
td .t{font-weight:600}
td .s{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border)}
.filters .in{width:auto;max-width:100%}
.filters .search{flex:1 1 220px}

.alerts{display:grid}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.alert:last-child{border-bottom:none}
.alert:hover{background:var(--surface2)}
.days{font-family:var(--f-display);font-weight:600;font-size:1.05rem;width:54px;text-align:center;border-radius:8px;padding:4px 0;line-height:1.1;font-variant-numeric:tabular-nums}
.days small{display:block;font-family:var(--f-body);font-size:10px;font-weight:500}

.tl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-top:10px}
.tl .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.tl .bar{width:100%;max-width:30px;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.tl .bar.hot{background:var(--warn)}
.tl .n{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .m{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.bytype{display:grid;gap:10px}
.bt{display:grid;grid-template-columns:minmax(120px,200px) 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bt .track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bt .track i{display:block;height:100%;background:var(--acc);border-radius:99px}

.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.docs{display:grid}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border)}
.doc:last-child{border-bottom:none}
.ext{width:38px;height:44px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--f-mono);color:#fff;flex:none;background:#6b6782}
.ext.pdf{background:#d0353f}.ext.docx,.ext.doc{background:#2b6cd6}.ext.xlsx,.ext.xls,.ext.csv{background:#1b8a4c}.ext.jpg,.ext.jpeg,.ext.png{background:#8a5cd6}.ext.msg,.ext.eml{background:#0f7a9a}
.sp{display:flex;gap:8px;align-items:flex-start;background:var(--info-soft);border-radius:8px;padding:10px 12px;font-size:12.5px}
.sp svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--info)}
.sp code{font-family:var(--f-mono);font-size:11.5px;word-break:break-all}
.hist{display:grid;padding:6px 18px 14px;max-height:520px;overflow:auto}
.h{display:grid;grid-template-columns:12px 1fr;gap:12px;padding:8px 0;position:relative}
.h::before{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:2px;background:var(--border)}
.h:last-child::before{display:none}
.h i{width:12px;height:12px;border-radius:50%;background:var(--acc);margin-top:5px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--acc)}
.h .w{font-size:12px;color:var(--muted)}
.h .d{font-size:12.5px;word-break:break-word}

.drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;display:grid;gap:6px;place-items:center;cursor:pointer;background:var(--surface2)}
.drop:hover,.drop.over{border-color:var(--acc)}
.drop svg{width:30px;height:30px;color:var(--acc)}
.files{display:grid;gap:8px;margin-top:12px}
.file{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.file .prog{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.file .prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}

.modal-bg{position:fixed;inset:0;background:rgba(15,10,30,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:600px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .card-b{display:grid;gap:14px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:13.5px;max-width:min(440px,calc(100vw - 32px));z-index:60;box-shadow:var(--shadow);white-space:pre-line}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px}
.msg{padding:10px 12px;border-radius:8px;font-size:13px}
.msg.erro{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chips input{accent-color:var(--acc)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.menu-btn{display:none}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dash,.detail{grid-template-columns:1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;height:auto;z-index:40;transform:translateX(-100%);transition:transform .2s;width:min(280px,85vw)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .menu-btn{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
  .hide-m{display:none}
}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:1fr}.alert{grid-template-columns:auto 1fr}.alert>:last-child{display:none}.bt{grid-template-columns:100px 1fr 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═════ Visual moderno (identidade Sinergia) ═════ */
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em} h2{font-size:1.15rem;font-weight:600;letter-spacing:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;font-family:var(--f-display);font-size:19px;box-shadow:0 6px 16px rgba(209,47,51,.35)}
.brand strong{font-family:var(--f-display);font-size:17px;letter-spacing:.18em;font-weight:700}
.brand small{font-size:11.5px}
/* barra lateral escura */
.side{background:var(--side);border-right:none;color:var(--side-fg);padding:22px 14px}
.side .brand small{color:var(--side-muted)}
.side #sel-emp{background:var(--side2);border-color:#2b2f38;color:var(--side-fg)}
.nav{gap:4px}
.nav .grp{color:var(--side-muted);padding:16px 12px 6px;font-size:10.5px;letter-spacing:.14em}
.nav a{color:#c9ccd4;padding:10px 12px;border-radius:10px;font-weight:500;position:relative}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(209,47,51,.22),rgba(209,47,51,.06));color:#fff}
.nav a.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc)}
.nav a.on svg{color:var(--acc)}
.nav .count{background:var(--acc)}
.me{border-top:1px solid #23262e;color:var(--side-fg)}
.me .muted{color:var(--side-muted)!important}
.me .avatar{background:var(--side2);color:#fff}
.side .btn{background:var(--side2);border-color:#2b2f38;color:var(--side-fg)}
/* conteudo */
.main{padding-top:30px}
.top{margin-bottom:22px}
.top p{font-size:13.5px}
.card{border-color:var(--border);border-radius:var(--r)}
.card-h{padding:16px 20px;border-bottom-color:var(--border)}
.card-b{padding:20px}
.btn{border-radius:10px;padding:9px 16px;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn.pri{box-shadow:0 6px 16px rgba(209,47,51,.28)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(209,47,51,.32)}
.in{border-radius:10px;padding:9px 12px}
/* KPIs */
.kpis{gap:14px;margin-bottom:18px}
.kpi{border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);gap:4px;transition:transform .15s,box-shadow .15s}
.kpi::before{display:none}
.kpi:hover{transform:translateY(-2px);border-color:var(--border);box-shadow:0 12px 28px rgba(16,18,24,.09)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .lbl{font-size:12.5px}
.kpi .ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);flex:none}
.kpi .ki svg{width:18px;height:18px}
.kpi .val{font-size:2.1rem;font-weight:700;line-height:1.05;margin-top:2px}
/* barras e listas */
.pbar .track,.bt .track{height:10px}
.pbar .track i,.bt .track i{background:linear-gradient(90deg,var(--acc),#f06a5f)}
.tl .bar{background:linear-gradient(180deg,var(--bar1),var(--bar2));opacity:1;border-radius:6px 6px 3px 3px}
.tl .bar.hot{background:linear-gradient(180deg,#f06a5f,var(--acc))}
.days{border-radius:10px;padding:6px 0}
.alert{padding:13px 20px}
th{background:var(--surface2);border-bottom:none;font-size:11px}
tbody tr.link:hover td{background:color-mix(in srgb,var(--acc) 4%,var(--surface))}
.pill{padding:3px 10px}
.tag{border-radius:8px}
.filters{padding:16px 20px;gap:10px}
.drop{border-radius:14px;background:color-mix(in srgb,var(--acc) 3%,var(--surface2))}
.drop svg{color:var(--acc)}
.h i{background:var(--acc);box-shadow:0 0 0 1px var(--acc)}
/* login em duas metades */
#v-login{padding:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);place-items:stretch}
#v-login::before{content:"";background:radial-gradient(120% 80% at 0% 100%,rgba(209,47,51,.45),transparent 55%),radial-gradient(90% 60% at 100% 0%,rgba(209,47,51,.18),transparent 60%),var(--side);display:block}
#v-login .login{align-self:center;justify-self:center;margin:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));border-radius:18px;padding:32px}
.login-hero{position:fixed;left:0;top:0;bottom:0;width:52.4%;display:flex;flex-direction:column;justify-content:flex-end;padding:56px;color:#fff;pointer-events:none}
.login-hero b{font-family:var(--f-display);font-size:13px;letter-spacing:.3em;color:#f3a3a5}
.login-hero h2{font-size:2.6rem;line-height:1.05;margin:12px 0 14px;max-width:16ch;font-weight:700}
.login-hero p{margin:0;color:#c3c6ce;max-width:46ch;font-size:15px}
@media (max-width:900px){#v-login{grid-template-columns:1fr}#v-login::before,.login-hero{display:none}}
@media (max-width:820px){.side{box-shadow:none}.side.open{box-shadow:0 0 50px rgba(0,0,0,.45)}}

    background:color-mix(in srgb,var(--side) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid #23262e;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border:none;background:none;color:#9aa0ad;font-size:11px;font-weight:600;text-decoration:none;border-radius:10px;cursor:pointer;min-height:48px}

  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

  .alert{padding:12px 16px}

}

  #tb tr.link td{display:block;padding:0;border:none;background:none!important}
  #tb td:nth-child(1){grid-column:1;grid-row:1}

<body>

<section id="v-login" hidden>
  <div class="login-hero" aria-hidden="true"><b>SINERGIA</b><h2>Contratos organizados. Pagamentos conferidos.</h2><p>Todos os contratos da empresa num só lugar, com os vencimentos, os documentos e quem pode ver cada um.</p></div>
  <form class="login" id="f-login">
    <div class="brand"><div class="brand-mark">S</div><div><strong>SINERGIA</strong><small>Gestão de Contratos</small></div></div>
    <div id="login-titulo"><h2>Entrar</h2><p class="muted" style="margin:4px 0 0">Use o mesmo e-mail e senha do portal da Sinergia.</p></div>
    <div id="bloco-login" style="display:grid;gap:14px">
      <div class="field"><label for="l-email">E-mail</label><input class="in" id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-senha">Senha</label><input class="in" id="l-senha" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" type="submit">Entrar</button>
      <button class="btn ghost sm" type="button" id="btn-esqueci">Esqueci minha senha</button>
    </div>
    <div id="bloco-nova" hidden style="display:grid;gap:14px">
      <div class="field"><label for="n-senha">Nova senha</label><input class="in" id="n-senha" type="password" minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="n-senha2">Repita a nova senha</label><input class="in" id="n-senha2" type="password" minlength="8" autocomplete="new-password"></div>
      <button class="btn pri" type="button" id="btn-nova">Salvar nova senha</button>
    </div>
    <div id="login-msg"></div>
  </form>
</section>

<div class="shell" id="v-app" hidden>
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">S</div><div><strong>SINERGIA</strong><small>Gestão de Contratos · <span id="side-emp"></span></small></div></div>
    <select class="in" id="sel-emp" hidden aria-label="Empresa"></select>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="avatar" id="me-av"></div><div style="min-width:0;flex:1"><div style="font-weight:600;font-size:13px" id="me-nome"></div><div class="muted" style="font-size:12px" id="me-papel"></div></div><button class="btn sm" id="btn-sair">Sair</button></div>
  </aside>
  <main class="main" id="main"><div class="loading">Carregando…</div></main>
  <div class="scrim" id="scrim" data-act="menu"></div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
const SUPABASE_URL = 'https://dcdbsiuveisxoypcblzd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hYZiMKCggK1yAJ9Ryzwylw_qq-VRwLQ';
const FN_URL = SUPABASE_URL + '/functions/v1/ctr-arquivos';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// cliente sem sessao: cadastra usuarios sem derrubar o login do admin (igual ao portal)
const sbCadastro = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'sb-cadastro' } });

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciais = n => { const p = String(n||'').trim().split(/\s+/).filter(Boolean); return p.length ? (p[0][0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase() : '?'; };
const hojeD = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmt = s => s ? parse(s).toLocaleDateString('pt-BR') : '—';
const fmtTs = s => s ? new Date(s).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' }) : '';
const dias = c => c.fim ? Math.round((parse(c.fim) - hojeD()) / 864e5) : null;
const brl = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const brl0 = v => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const tam = b => b > 1048576 ? (b/1048576).toFixed(1).replace('.',',') + ' MB' : Math.max(1, Math.round((b||0)/1024)) + ' KB';
const LV = ['Sem acesso','Ver','Ver e baixar','Editar e enviar'];
const CATEGORIAS = { 'contrato-assinado':'Contrato principal assinado', 'minuta':'Minuta', 'aditivo':'Aditivo', 'anexo':'Anexo / planilha', 'distrato':'Distrato / rescisão', 'renovacao':'Renovação', 'correspondencia':'Correspondência / e-mail' };
const REAJUSTES = ['IPCA','IGP-M','INPC','Convenção coletiva','Fixo','Outro'];

const icon = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .7 3.2 2.6 3.6 5.4"/></svg>',
  imp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};

// ═════════ Estado ═════════
let PERFIL = null, EMPRESAS = [], EMP = null, NIVEL_EMP = 0;
let CONTRATOS = [], NAT = new Map(), FIL = new Map(), FORN = new Map(), DOCS = new Map(), PESSOAS = [];
let carregado = false, recuperando = false;
const ehAdmin = () => PERFIL && PERFIL.papel === 'admin';

function toast(t, ms = 3800){ const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => e.hidden = true, ms); }
function erroTxt(e){
  const m = (e && (e.message || e.error_description || e.erro || e)) + '';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado.';
  if (/already registered|already been registered|User already/i.test(m)) return 'Este e-mail já tem cadastro.';
  if (/Password should be at least/i.test(m)) return 'A senha precisa ter pelo menos 8 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  if (/row-level security|permission denied/i.test(m)) return 'Seu acesso não permite fazer isso.';
  if (/relation .*ctr_|does not exist|schema cache/i.test(m)) return 'O banco dos contratos ainda não foi instalado (falta rodar o SQL).';
  return m;
}
function msgEm(sel, texto, tipo = 'erro'){ const el = $(sel); if (el) el.innerHTML = texto ? `<div class="msg ${tipo}">${esc(texto)}</div>` : ''; }

// chama a funcao do servidor (SharePoint)
async function fn(corpo){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Sua sessão expirou. Entre de novo.');
  let r;
  try {
    r = await fetch(FN_URL, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + session.access_token, apikey: SUPABASE_KEY }, body: JSON.stringify(corpo) });
  } catch (e) { throw new Error('Não foi possível falar com o servidor de arquivos. Verifique a internet.'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 404 && !j.erro) throw new Error('A função de arquivos ainda não foi instalada no Supabase.');
  if (!r.ok) throw new Error(j.erro || ('Erro ' + r.status));
  return j;
}

// ═════════ Login ═════════
$('#f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); msgEm('#login-msg', '');
  const b = ev.submitter; if (b) { b.disabled = true; b.textContent = 'Entrando…'; }
  const { error } = await sb.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-senha').value });
  if (b) { b.disabled = false; b.textContent = 'Entrar'; }
  if (error) msgEm('#login-msg', erroTxt(error));
});
$('#btn-esqueci').addEventListener('click', async () => {
  const email = $('#l-email').value.trim();
  if (!email) { msgEm('#login-msg', 'Digite seu e-mail acima e clique de novo em "Esqueci minha senha".'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  msgEm('#login-msg', error ? erroTxt(error) : 'Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.', error ? 'erro' : 'ok');
});
$('#btn-nova').addEventListener('click', async () => {
  msgEm('#login-msg', '');
  const a = $('#n-senha').value, b = $('#n-senha2').value;
  if (a.length < 8) { msgEm('#login-msg', 'A senha precisa ter pelo menos 8 caracteres.'); return; }
  if (a !== b) { msgEm('#login-msg', 'As duas senhas não são iguais.'); return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) { msgEm('#login-msg', erroTxt(error)); return; }
  recuperando = false; history.replaceState(null, '', location.pathname + '#painel');
  toast('Senha alterada.'); carregado = false; iniciar();
});
$('#btn-sair').addEventListener('click', async () => { await sb.auth.signOut(); });

function mostrarLogin(nova = false){
  $('#v-app').hidden = true; $('#v-login').hidden = false;
  $('#bloco-login').hidden = nova; $('#bloco-nova').hidden = !nova;
  $('#login-titulo').innerHTML = nova ? '<h2>Criar nova senha</h2>' : '<h2>Entrar</h2><p class="muted" style="margin:4px 0 0">Use o mesmo e-mail e senha do portal da Sinergia.</p>';
}
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'PASSWORD_RECOVERY') { recuperando = true; mostrarLogin(true); return; }
  if (evento === 'SIGNED_OUT') { carregado = false; PERFIL = null; mostrarLogin(); return; }
  if ((evento === 'SIGNED_IN' || evento === 'INITIAL_SESSION') && sessao && !recuperando && !carregado) setTimeout(iniciar, 0);
  if (evento === 'INITIAL_SESSION' && !sessao) mostrarLogin();
});

// ═════════ Carregar dados ═════════
async function iniciar(){
  if (carregado) return; carregado = true;
  $('#v-login').hidden = true; $('#v-app').hidden = false;
  $('#main').innerHTML = '<div class="loading">Carregando…</div>';
  try {
    const { data: { user } } = await sb.auth.getUser();
    const { data: p, error } = await sb.from('perfis').select('id,nome,email,papel,ativo').eq('id', user.id).maybeSingle();
    if (error) throw error;
    if (!p || !p.ativo) { telaSemAcesso('Seu usuário não está ativo. Fale com o administrador da Sinergia.'); return; }
    PERFIL = p;
    if (ehAdmin()) {
      const { data, error: e2 } = await sb.from('empresas').select('slug,nome').order('nome'); if (e2) throw e2;
      EMPRESAS = (data || []).map(e => ({ ...e, nivel: 3 }));
    } else {
      const { data: ac, error: e3 } = await sb.from('ctr_acessos').select('empresa,nivel').eq('usuario', p.id); if (e3) throw e3;
      const { data: em } = await sb.from('empresas').select('slug,nome');
      const nomes = new Map((em || []).map(e => [e.slug, e.nome]));
      EMPRESAS = (ac || []).map(a => ({ slug: a.empresa, nome: nomes.get(a.empresa) || a.empresa, nivel: a.nivel }));
    }
    if (!EMPRESAS.length) { telaSemAcesso('Seu usuário ainda não tem acesso a nenhuma empresa nos contratos. Fale com o administrador da Sinergia.'); return; }
    let guardada = null; try { guardada = localStorage.getItem('ctr-emp'); } catch (_) {}
    const e = EMPRESAS.find(x => x.slug === guardada) || EMPRESAS.find(x => x.slug === 'millena') || EMPRESAS[0];
    const sel = $('#sel-emp');
    sel.innerHTML = EMPRESAS.map(x => `<option value="${esc(x.slug)}">${esc(x.nome)}</option>`).join('');
    sel.hidden = EMPRESAS.length < 2;
    sel.onchange = () => trocarEmpresa(sel.value);
    $('#me-av').textContent = iniciais(p.nome); $('#me-nome').textContent = p.nome; $('#me-papel').textContent = ehAdmin() ? 'Administrador' : '';
    await trocarEmpresa(e.slug);
  } catch (err) {
    carregado = false;
    $('#main').innerHTML = `<div class="card"><div class="card-b"><div class="msg erro">${esc(erroTxt(err))}</div><p><button class="btn" onclick="location.reload()">Tentar de novo</button></p></div></div>`;
  }
}
function telaSemAcesso(t){
  $('#nav').innerHTML = ''; $('#side-emp').textContent = '';
  $('#main').innerHTML = `<div class="card"><div class="card-b" style="display:grid;gap:12px;justify-items:start"><h2>Sem acesso</h2><p class="muted" style="margin:0">${esc(t)}</p><button class="btn" id="b-sair2">Sair</button></div></div>`;
  $('#b-sair2').onclick = () => sb.auth.signOut();
}
async function trocarEmpresa(slug){
  EMP = slug; try { localStorage.setItem('ctr-emp', slug); } catch (_) {}
  const e = EMPRESAS.find(x => x.slug === slug); NIVEL_EMP = e ? e.nivel : 0;
  $('#sel-emp').value = slug; $('#side-emp').textContent = e ? e.nome : slug;
  $('#me-papel').textContent = ehAdmin() ? 'Administrador' : LV[NIVEL_EMP];
  $('#main').innerHTML = '<div class="loading">Carregando contratos…</div>';
  await recarregar();
  render();
}
async function recarregar(){
  const [c, n, f, fo, pe] = await Promise.all([
    sb.from('ctr_contratos').select('*').eq('empresa', EMP).order('fim', { ascending: true, nullsFirst: false }).limit(5000),
    sb.from('ctr_naturezas').select('codigo,descricao,classe,tipo,aviso_dias').eq('empresa', EMP).limit(5000),
    sb.from('ctr_filiais').select('numero,nome').eq('empresa', EMP).limit(5000),
    sb.from('ctr_fornecedores').select('codigo,nome').eq('empresa', EMP).limit(10000),
    sb.rpc('ctr_pessoas', { p_empresa: EMP }),
  ]);
  for (const r of [c, n, f, fo]) if (r.error) throw r.error;
  CONTRATOS = c.data || [];
  NAT = new Map((n.data || []).map(x => [x.codigo, x]));
  FIL = new Map((f.data || []).map(x => [x.numero, x.nome]));
  FORN = new Map((fo.data || []).map(x => [x.codigo, x.nome]));
  PESSOAS = pe.error ? [] : (pe.data || []);
  // quantos documentos cada contrato tem (so os que a pessoa pode ver)
  DOCS = new Map();
  const ids = CONTRATOS.map(x => x.id);
  for (let i = 0; i < ids.length; i += 300) {
    const { data, error } = await sb.from('ctr_documentos').select('contrato,categoria').in('contrato', ids.slice(i, i + 300)).limit(10000);
    if (error) throw error;
    for (const d of data || []) { const a = DOCS.get(d.contrato) || []; a.push(d.categoria); DOCS.set(d.contrato, a); }
  }
}

// ═════════ Regras de exibicao ═════════
const nomeFilial = n => n == null ? '—' : (FIL.get(n) ? `${n} · ${FIL.get(n)}` : `Filial ${n}`);
const nomeNat = n => n == null ? '—' : (NAT.get(n) ? `${n} · ${NAT.get(n).descricao}` : `Natureza ${n}`);
const classeDe = c => (NAT.get(c.natureza) || {}).classe || 'Sem classe';
const temDoc = c => (DOCS.get(c.id) || []).length > 0;
const pessoa = id => (PESSOAS.find(p => p.id === id) || {}).nome || '—';
function situ(c){
  if (c.situacao === 'encerrado') return { k:'mut', t:'Encerrado', cod:'encerrado' };
  const d = dias(c);
  if (d === null) return { k:'mut', t:'Sem datas', cod:'semdatas' };
  if (d < 0) return { k:'bad', t:'Vencido', cod:'vencido' };
  if (d <= c.aviso_dias) return { k:'warn', t:'Prazo de aviso', cod:'aviso' };
  if (d <= c.aviso_dias + 60) return { k:'info', t:'Vence em breve', cod:'breve' };
  return { k:'ok', t:'Vigente', cod:'vigente' };
}
const pendente = c => c.situacao !== 'encerrado' && (!temDoc(c) || !c.fim);
const nivelC = c => ehAdmin() ? 3 : NIVEL_EMP;   // o banco ja escondeu o que a pessoa nao pode ver

// ═════════ Navegacao ═════════
function nav(){
  const h = location.hash.slice(1) || 'painel';
  const alertas = CONTRATOS.filter(c => ['vencido','aviso'].includes(situ(c).cod)).length;

function vLista(q){
  const p = new URLSearchParams(q || '');
  const classes = [...new Set(CONTRATOS.map(classeDe))].sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));
  const filiais = [...new Set(CONTRATOS.map(c => c.filial).filter(x => x != null))].sort((a, b) => a - b);
  let limite = 200;
  const filtrar = () => {
    const t = $('#f-q').value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''), cl = $('#f-cl').value, fi = $('#f-fi').value, st = $('#f-st').value;
    return CONTRATOS.filter(c => {
      const s = situ(c);
      if (t && !(`${c.titulo} ${c.fornecedor_nome} ${c.fornecedor || ''} ${c.numero} ${c.natureza || ''}`).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(t)) return false;
      if (cl && classeDe(c) !== cl) return false;
      if (fi && String(c.filial) !== fi) return false;
      if (st === 'pendente') return pendente(c);
      if (st === 'semdoc') return c.situacao !== 'encerrado' && !temDoc(c);
      if (st && s.cod !== st) return false;
      if (!st && c.situacao === 'encerrado') return false;
      return true;
    }).sort((a, b) => (dias(a) ?? 1e9) - (dias(b) ?? 1e9) || a.titulo.localeCompare(b.titulo));
  };
  const linhas = () => {
    const r = filtrar();
    $('#tb').innerHTML = r.length ? r.slice(0, limite).map(c => { const s = situ(c), d = dias(c); return `<tr class="link" data-go="contrato/${c.id}">
      <td><div class="t">${esc(c.titulo)} ${c.confidencial ? `<span class="lock" title="Confidencial">${icon.lock}</span>` : ''}</div><div class="s"><span class="mono">${esc(c.numero)}</span>${temDoc(c) ? '' : ' · <span class="tag semdoc">sem documento</span>'}</div></td>
      <td>${esc(c.fornecedor_nome)}<div class="s mono">${esc(c.fornecedor || '')}</div></td>
      <td class="hide-m">${esc(nomeFilial(c.filial))}</td>
      <td class="hide-m"><span class="tag" title="${esc(classeDe(c))}">${esc(nomeNat(c.natureza))}</span></td>
      <td class="num">${fmt(c.fim)}${d !== null ? `<div class="s">${d < 0 ? `há ${-d} dias` : `em ${d} dias`}</div>` : ''}</td>

      + (r.length > limite ? `<tr><td colspan="7" style="text-align:center"><button class="btn sm" id="mais">Mostrar mais (${r.length - limite} restantes)</button></td></tr>` : '')
      : `<tr><td colspan="7" class="empty">Nenhum contrato com esses filtros.</td></tr>`;
    $('#cnt').textContent = `${r.length} de ${CONTRATOS.length}`;
    const m = $('#mais'); if (m) m.onclick = ev => { ev.stopPropagation(); limite += 200; linhas(); };
  };
  depois(() => {
    if (p.get('st')) $('#f-st').value = p.get('st');
    ['#f-q', '#f-cl', '#f-fi', '#f-st'].forEach(id => $(id).addEventListener('input', () => { limite = 200; linhas(); }));
    $('#b-exp').onclick = () => exportar(filtrar());
    linhas();
  });
  return topo('Contratos', 'Todos os contratos que o seu acesso permite ver.', `<button class="btn" id="b-exp">${icon.dl}Exportar Excel</button>` + (NIVEL_EMP >= 3 ? `<a class="btn pri" href="#novo">${icon.plus}Novo contrato</a>` : ''))
  + `<div class="card"><div class="filters">
      <input class="in search" id="f-q" placeholder="Buscar por nome, fornecedor, código ou número" aria-label="Buscar">
      <select class="in" id="f-cl" aria-label="Classe"><option value="">Todas as classes</option>${classes.map(c => `<option>${esc(c)}</option>`).join('')}</select>
      <select class="in" id="f-fi" aria-label="Filial"><option value="">Todas as filiais</option>${filiais.map(f => `<option value="${f}">${esc(nomeFilial(f))}</option>`).join('')}</select>
      <select class="in" id="f-st" aria-label="Situação"><option value="">Ativos (todas as situações)</option><option value="vigente">Vigente</option><option value="breve">Vence em breve</option><option value="aviso">Prazo de aviso</option><option value="vencido">Vencido</option><option value="semdatas">Sem datas</option><option value="semdoc">Sem documento</option><option value="pendente">Pendentes (sem documento ou sem datas)</option><option value="encerrado">Encerrados</option></select>
      <span class="muted small" style="align-self:center" id="cnt"></span>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Contrato</th><th>Fornecedor</th><th class="hide-m">Filial</th><th class="hide-m">Natureza</th><th>Vencimento</th><th class="hide-m">Valor/mês</th><th>Situação</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
}
function exportar(lista){
  if (!window.XLSX) { toast('A ferramenta de Excel ainda está carregando. Tente de novo em 2 segundos.'); return; }
  const linhas = lista.map(c => ({ 'Número': c.numero, 'Contrato': c.titulo, 'Fornecedor (código)': c.fornecedor || '', 'Fornecedor': c.fornecedor_nome,
    'Filial': c.filial, 'Nome da filial': FIL.get(c.filial) || '', 'Natureza': c.natureza, 'Descrição da natureza': (NAT.get(c.natureza) || {}).descricao || '', 'Classe': classeDe(c),

  const ws = XLSX.utils.json_to_sheet(linhas); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Contratos');
  XLSX.writeFile(wb, `Contratos_${EMP}_${new Date().toISOString().slice(0, 10)}.xlsx`);

    </div>

      ${c ? `<label class="check"><input type="checkbox" id="c-enc" ${c.situacao === 'encerrado' ? 'checked' : ''} ${dis}> Encerrado (não vale mais)</label>` : ''}
    </div>
    <datalist id="dl-forn">${[...FORN].slice(0, 3000).map(([k, n]) => `<option value="${esc(k + ' - ' + n)}">`).join('')}</datalist>

function lerForm(){
  const forn = $('#c-forn').value.trim();
  let fornecedor = null, fornecedor_nome = forn;
  const mf = /^([A-Za-z0-9]{2,20})\s+-\s+(.+)$/.exec(forn);
  if (mf && (FORN.has(mf[1]) || /\d/.test(mf[1]))) { fornecedor = mf[1]; fornecedor_nome = mf[2].trim(); }
  const nat = $('#c-nat').value.trim(); const mn = /^(\d+)/.exec(nat);
  const fil = $('#c-fil').value.trim();
  const valor = $('#c-valor').value.trim().replace(/[R$\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.');
  const dados = {
    titulo: $('#c-titulo').value.trim(), fornecedor, fornecedor_nome, natureza: mn ? Number(mn[1]) : null,
    filial: fil === '' ? null : Number(fil), responsavel: $('#c-resp').value || null,
    inicio: $('#c-ini').value || null, fim: $('#c-fim').value || null, aviso_dias: Number($('#c-aviso').value || 0),
    valor_mensal: valor === '' ? null : Number(valor), reajuste: $('#c-reaj').value || null,
    renovacao_automatica: $('#c-renov').value === 's', observacao: $('#c-obs').value.trim() || null, confidencial: $('#c-conf').checked,
  };
  if ($('#c-enc')) dados.situacao = $('#c-enc').checked ? 'encerrado' : 'ativo';
  if (!dados.titulo) return { erro: 'Preencha o nome do contrato.' };
  if (!dados.fornecedor_nome) return { erro: 'Preencha o fornecedor.' };
  if (dados.valor_mensal !== null && !isFinite(dados.valor_mensal)) return { erro: 'O valor mensal não é um número válido.' };
  if (dados.filial !== null && !Number.isInteger(dados.filial)) return { erro: 'A filial precisa ser o número da filial.' };
  if (dados.inicio && dados.fim && dados.fim < dados.inicio) return { erro: 'O vencimento está antes do início.' };
  if (!Number.isInteger(dados.aviso_dias) || dados.aviso_dias < 0) return { erro: 'O aviso prévio precisa ser um número de dias.' };
  return { dados };
}

function vNovo(){
  if (NIVEL_EMP < 3) return semPermissao();
  depois(() => {
    $('#c-nat').addEventListener('change', () => { const m = /^(\d+)/.exec($('#c-nat').value); const n = m && NAT.get(Number(m[1])); if (n && n.aviso_dias) $('#c-aviso').value = n.aviso_dias; });
    $('#b-salvar').onclick = async () => {
      const { dados, erro } = lerForm(); if (erro) { msgEm('#c-msg', erro); return; }
      $('#b-salvar').disabled = true;

// ═════════ Envio de arquivos (direto do navegador para o SharePoint, em partes) ═════════
function ligarUpload(c){
  const dz = $('#dz'), inp = $('#u-file'); if (!dz) return;
  dz.onclick = () => inp.click();
  dz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } };
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => enviarVarios(c, [...e.dataTransfer.files]));
  inp.onchange = () => { enviarVarios(c, [...inp.files]); inp.value = ''; };
}
async function enviarVarios(c, files){
  const cat = $('#u-cat').value;
  const fila = $('#fila');
  for (const f of files) {
    const row = document.createElement('div'); row.className = 'file';
    row.innerHTML = `<div style="min-width:0"><div style="font-size:13px;font-weight:500;word-break:break-all">${esc(f.name)}</div><div class="muted small" data-st>Preparando…</div><div class="prog"><i></i></div></div><span></span>`;
    fila.prepend(row);
    const st = row.querySelector('[data-st]'), bar = row.querySelector('.prog i');
    try {
      if (f.size > 250 * 1024 * 1024) throw new Error('O arquivo passa de 250 MB.');
      if (!f.size) throw new Error('O arquivo está vazio.');
      const ini = await fn({ acao: 'iniciar', contrato: c.id, categoria: cat, nome_original: f.name, tamanho: f.size });
      st.textContent = 'Enviando como ' + ini.nome;
      const PARTE = 320 * 1024 * 20;   // 6,25 MB (multiplo de 320 KB, exigido pela Microsoft)
      let pos = 0, item = null;
      while (pos < f.size) {
        const fim = Math.min(pos + PARTE, f.size);
        let r, tent = 0;
        while (true) {
          try { r = await fetch(ini.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${pos}-${fim - 1}/${f.size}` }, body: f.slice(pos, fim) }); }
          catch (e) { r = null; }
          if (r && (r.ok || r.status === 202)) break;
          if (++tent >= 4) throw new Error('A conexão caiu durante o envio. Tente de novo.');
          await new Promise(ok => setTimeout(ok, 1500 * tent));
        }
        if (r.status === 200 || r.status === 201) item = await r.json();
        pos = fim; bar.style.width = (pos / f.size * 100) + '%';
      }
      if (!item || !item.id) throw new Error('O SharePoint não confirmou o arquivo.');
      st.textContent = 'Registrando…';
      const reg = await fn({ acao: 'registrar', contrato: c.id, categoria: cat, item_id: item.id, nome_original: f.name });
      st.innerHTML = `<span style="color:var(--ok)">Salvo no SharePoint:</span> <span class="mono">${esc(reg.caminho)}</span>`;
    } catch (e) { st.innerHTML = `<span style="color:var(--bad)">${esc(erroTxt(e))}</span>`; bar.style.background = 'var(--bad)'; }
  }
  await Promise.all([listarDocs(c, nivelC(c)), listarHist(c)]);
}

function senhaTemp(){ const a = 'abcdefghjkmnpqrstuvwxyz23456789'; const r = crypto.getRandomValues(new Uint32Array(10)); let s = ''; for (let i = 0; i < 10; i++) s += a[r[i] % a.length]; return s.slice(0, 5) + '-' + s.slice(5); }

  return topo('Importar planilhas', 'Os arquivos são lidos no seu navegador e os dados vão direto para o banco. Nada passa pelo GitHub.')
    + `<div class="note" style="margin-bottom:16px">Ordem recomendada: <b>1. Naturezas</b> → <b>2. Filiais</b> → <b>3. Aluguéis / prestadores</b>. Pode importar de novo quando a planilha mudar: o que já existe é atualizado, e os contratos não são duplicados.</div>
    <div class="stack">
      ${bloco('naturezas', '1. Cadastro de naturezas', 'O plano de naturezas do sistema do cliente. O código da natureza vira o tipo do contrato.', '<span class="mono">Codigo, Descrição, Classe, Despesa / Receita</span>')}
      ${bloco('filiais', '2. Cadastro de filiais', 'Liga o número da filial ao nome da loja.', '<span class="mono">Filial (ou Número/Código), Nome (ou Descrição/Cidade)</span>')}
      ${bloco('contratos', '3. Aluguéis, prestadores de serviço e outros', 'Cada combinação filial + fornecedor + natureza (+ valor) vira um contrato <b>pendente</b>: depois é só anexar o documento e preencher as datas.', '<span class="mono">Filial, Fornecedor ("CÓDIGO - NOME"), Natureza, Valor (opcional)</span>')}
    </div>`;
}
const normCab = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function acharColuna(cab, opcoes){ const n = cab.map(normCab); for (const o of opcoes) { const i = n.findIndex(x => x === o || x.startsWith(o + ' ')); if (i >= 0) return i; } for (const o of opcoes) { const i = n.findIndex(x => x.includes(o)); if (i >= 0) return i; } return -1; }
async function lerPlanilha(tipo, arquivo){
  const res = $('#res-' + tipo);
  if (!window.XLSX) { res.innerHTML = '<div class="msg erro">A ferramenta de Excel ainda está carregando. Tente de novo.</div>'; return; }
  res.innerHTML = '<div class="muted">Lendo…</div>';
  try {
    const wb = XLSX.read(await arquivo.arrayBuffer(), { type: 'array' });
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null }).filter(r => r.some(v => v !== null && String(v).trim() !== ''));
    if (linhas.length < 2) throw new Error('A planilha está vazia.');
    const cab = linhas[0], dados = linhas.slice(1);
    if (tipo === 'naturezas') return prepararNaturezas(res, cab, dados);
    if (tipo === 'filiais') return prepararFiliais(res, cab, dados);
    return prepararContratos(res, cab, dados, arquivo.name);
  } catch (e) { res.innerHTML = `<div class="msg erro">${esc(erroTxt(e))}</div>`; }
}
const int = v => { const n = Number(String(v ?? '').trim()); return Number.isInteger(n) ? n : null; };
const txt = v => String(v ?? '').trim();
async function gravarLotes(tabela, linhas, conflito, res, rotulo){
  for (let i = 0; i < linhas.length; i += 500) {
    const r = await sb.from(tabela).upsert(linhas.slice(i, i + 500), { onConflict: conflito });
    if (r.error) throw r.error;
    res.innerHTML = `<div class="muted">Gravando ${rotulo}… ${Math.min(i + 500, linhas.length)} de ${linhas.length}</div>`;
  }
}
function confirmarImport(res, resumo, acao){
  res.innerHTML = `<div style="display:grid;gap:10px">${resumo}<div><button class="btn pri" data-ok>Confirmar importação</button> <button class="btn" data-cancel>Cancelar</button></div></div>`;
  res.querySelector('[data-cancel]').onclick = () => res.innerHTML = '';
  res.querySelector('[data-ok]').onclick = async ev => {
    ev.target.disabled = true;
    try { const fim = await acao(); res.innerHTML = `<div class="msg ok">${fim}</div>`; await recarregar(); nav(); }
    catch (e) { res.innerHTML = `<div class="msg erro">${esc(erroTxt(e))}</div>`; }
  };
}
function prepararNaturezas(res, cab, dados){
  const ic = acharColuna(cab, ['codigo', 'natureza', 'cod']), id = acharColuna(cab, ['descricao', 'nome']), icl = acharColuna(cab, ['classe', 'grupo']), it = acharColuna(cab, ['despesa receita', 'tipo', 'd r']);
  if (ic < 0 || id < 0) throw new Error('Não encontrei as colunas "Codigo" e "Descrição".');
  const m = new Map();
  for (const r of dados) { const cod = int(r[ic]); if (cod === null || !txt(r[id])) continue; m.set(cod, { empresa: EMP, codigo: cod, descricao: txt(r[id]).replace(/^#\s*/, ''), classe: icl >= 0 ? txt(r[icl]) || null : null, tipo: it >= 0 ? txt(r[it]) || null : null }); }
  const linhas = [...m.values()];
  confirmarImport(res, `<div>${linhas.length} naturezas encontradas, em ${new Set(linhas.map(x => x.classe)).size} classes.</div>`, async () => {
    await gravarLotes('ctr_naturezas', linhas, 'empresa,codigo', res, 'naturezas'); return `${linhas.length} naturezas importadas.`;
  });
}
function prepararFiliais(res, cab, dados){
  const inum = acharColuna(cab, ['filial', 'numero', 'codigo', 'cod']), inome = acharColuna(cab, ['nome', 'descricao', 'cidade', 'loja', 'fantasia']);
  if (inum < 0 || inome < 0 || inum === inome) throw new Error('Não encontrei a coluna do número da filial e a do nome.');
  const m = new Map();
  for (const r of dados) { const n = int(r[inum]); if (n === null || !txt(r[inome])) continue; m.set(n, { empresa: EMP, numero: n, nome: txt(r[inome]) }); }
  const linhas = [...m.values()];
  confirmarImport(res, `<div>${linhas.length} filiais encontradas.</div>`, async () => { await gravarLotes('ctr_filiais', linhas, 'empresa,numero', res, 'filiais'); return `${linhas.length} filiais importadas.`; });
}
function prepararContratos(res, cab, dados, nomeArq){
  const ifi = acharColuna(cab, ['filial']), ifo = acharColuna(cab, ['fornecedor', 'prestador', 'locador']), ina = acharColuna(cab, ['natureza']), iva = acharColuna(cab, ['valor']);
  if (ifi < 0 || ifo < 0 || ina < 0) throw new Error('Não encontrei as colunas Filial, Fornecedor e Natureza.');
  const grupos = new Map(), fornecedores = new Map(); let semNat = 0;
  for (const r of dados) {
    const filial = int(r[ifi]), nat = int(r[ina]), fo = txt(r[ifo]); if (!fo) continue;
    const m = /^\s*([^-\s][^-]*?)\s+-\s+(.+)$/.exec(fo); const cod = m ? m[1].trim() : null, nome = m ? m[2].trim() : fo;
    if (cod) fornecedores.set(cod, { empresa: EMP, codigo: cod, nome });
    if (nat !== null && !NAT.has(nat)) semNat++;
    const valor = iva >= 0 && r[iva] !== null && r[iva] !== '' && isFinite(Number(r[iva])) ? Math.round(Number(r[iva]) * 100) / 100 : null;
    const k = [filial, cod || nome, nat, valor].join('|');
    const g = grupos.get(k) || { filial, cod, nome, nat, valor, n: 0 }; g.n++; grupos.set(k, g);
  }
  const existe = new Set(CONTRATOS.filter(c => c.origem === 'importado').map(c => [c.filial, c.fornecedor || c.fornecedor_nome, c.natureza, c.valor_mensal == null ? null : Number(c.valor_mensal)].join('|')));
  const novos = [...grupos.entries()].filter(([k]) => !existe.has(k)).map(([, g]) => g);
  const repetidos = [...grupos.values()].filter(g => g.n > 1).length;
  const resumo = `<div>${dados.length} linhas → <b>${grupos.size}</b> contratos (filial + fornecedor + natureza${iva >= 0 ? ' + valor' : ''}), <b>${fornecedores.size}</b> fornecedores.</div>
    <div>${novos.length} contratos novos${grupos.size - novos.length ? `, ${grupos.size - novos.length} já importados antes (ficam como estão)` : ''}.</div>
    ${repetidos ? `<div class="msg erro" style="background:var(--warn-soft);color:var(--warn)">${repetidos} combinações aparecem repetidas na planilha (mesma filial, fornecedor e valor). Entram uma vez só, com o aviso "conferir duplicidade" nas observações.</div>` : ''}
    ${semNat ? `<div class="msg erro" style="background:var(--warn-soft);color:var(--warn)">${semNat} linhas têm natureza que não está no cadastro de naturezas. Importe as naturezas primeiro para aparecer a descrição.</div>` : ''}`;
  confirmarImport(res, resumo, async () => {
    await gravarLotes('ctr_fornecedores', [...fornecedores.values()], 'empresa,codigo', res, 'fornecedores');
    const linhas = novos.map(g => { const n = NAT.get(g.nat); return {
      empresa: EMP, filial: g.filial, fornecedor: g.cod, fornecedor_nome: g.nome, natureza: g.nat, valor_mensal: g.valor,
      titulo: `${n ? n.descricao.replace(/^#\s*/, '') : 'Natureza ' + (g.nat ?? '?')} – ${g.nome}`.slice(0, 200),
      aviso_dias: (n && n.aviso_dias) || 30, origem: 'importado',
      observacao: `Importado de ${nomeArq}.` + (g.n > 1 ? ` Aparece ${g.n} vezes na planilha: conferir duplicidade.` : ''),
    }; });
    for (let i = 0; i < linhas.length; i += 200) {
      const r = await sb.from('ctr_contratos').insert(linhas.slice(i, i + 200)); if (r.error) throw r.error;
      res.innerHTML = `<div class="muted">Gravando contratos… ${Math.min(i + 200, linhas.length)} de ${linhas.length}</div>`;
    }
    return `${linhas.length} contratos pendentes criados e ${fornecedores.size} fornecedores atualizados.`;
  });
}

// ═════════ Admin: SharePoint ═════════
function vSharePoint(){
  if (!ehAdmin()) return semPermissao();
  depois(() => {
    $('#b-testar').onclick = async () => {
      const r = $('#sp-res'); r.innerHTML = '<div class="muted">Testando…</div>';
      try {
        const j = await fn({ acao: 'testar' });
        r.innerHTML = `<div class="msg ok">Conectado. Pasta "${esc(j.pasta)}" encontrada ou criada.</div><div class="small" style="margin-top:8px">Biblioteca: <a href="${esc(j.webUrl)}" target="_blank" rel="noopener">${esc(j.webUrl)}</a>${j.total ? ` · ${tam(j.usado)} usados` : ''}</div>`;
      } catch (e) { r.innerHTML = `<div class="msg erro">${esc(erroTxt(e))}</div>`; }
    };
  });
  return topo('SharePoint', 'Onde os arquivos ficam guardados.')
    + `<div class="card"><div class="card-b" style="display:grid;gap:12px;justify-items:start">
      <div>Site: <span class="mono">sinerggiacombr.sharepoint.com/sites/GestaoContratos</span></div>
      <div class="muted small">Pastas: Contratos / Empresa / Natureza / Número – Fornecedor / arquivo padronizado.</div>
      <button class="btn pri" id="b-testar">${icon.cloud}Testar conexão</button><div id="sp-res" style="width:100%"></div></div></div>
    <div class="card" style="margin-top:16px;border-color:var(--warn)"><div class="card-b"><h3 style="color:var(--warn)">Ponto de atenção</h3>
    <p style="margin:6px 0 0">As regras de acesso daqui só valem para quem entra pelo sistema. O site do SharePoint precisa continuar fechado: só você e o aplicativo do sistema.</p></div></div>`;
}

// ═════════ Modal e utilidades ═════════
function abrirModal(titulo, corpo, botao, aoConfirmar){
  $('#modal-root').innerHTML = `<div class="modal-bg" data-fechar><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="card-h"><h2>${titulo}</h2><button class="btn sm ghost" data-fechar aria-label="Fechar">✕</button></div>
    <div class="card-b">${corpo}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="m-ok">${esc(botao)}</button></div></div></div></div>`;
  $('#m-ok').onclick = async () => { $('#m-ok').disabled = true; let ok = false; try { ok = await aoConfirmar(); } catch (e) { toast(erroTxt(e)); } if (ok !== false) fecharModal(); else if ($('#m-ok')) $('#m-ok').disabled = false; };
}
function confirmar(titulo, texto, botao, acao){ abrirModal(titulo, `<p style="margin:0">${texto}</p>`, botao, acao); }
function fecharModal(){ $('#modal-root').innerHTML = ''; }
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fechar]'); if (f && (e.target === f || f.tagName === 'BUTTON')) { fecharModal(); return; }
  const go = e.target.closest('[data-go]'); if (go && !e.target.closest('button,a,input,select,label')) { location.hash = go.dataset.go; return; }
  const a = e.target.closest('[data-act="menu"]'); if (a) document.body.classList.toggle('menu-aberto', $('#side').classList.toggle('open'));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
})();
</script>
